name: Build and Publish Docker Image
on:
  push:
    branches: [main]
permissions:
  packages: write
  contents: read
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./accessevent
          push: true
          tags: |
            ghcr.io/d4z3r0f/accessevent:latest
            ghcr.io/d4z3r0f/accessevent:${{ github.sha }}
      - name: Summary
        run: echo "PASS - Docker image built and published to GHCR"