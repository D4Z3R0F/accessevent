name: Day5 Check

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Check tests exist
        run: test -f accessevent/tests/test_models.py && test -f tests/test_api.py
      - name: Check docs exist
        run: |
          test -f accessevent/docs/test_cases.md
          test -f accessevent/docs/bug_reports.md
          test -f accessevent/docs/user_manual.md
          test -f accessevent/docs/admin_manual.md
          test -f accessevent/docs/api.md
          test -f accessevent/docs/assessment.md
      - name: Run tests
        run: |
          cd accessevent
          PYTHONPATH=. pytest tests -v
      - run: echo "PASS - Day 5 checks completed"

