name: Day3 Backend Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r accessevent/requirements.txt
      - name: Check project structure
        run: |
          test -f accessevent/app.py
          test -f accessevent/config.py
          test -f accessevent/models.py
          test -f accessevent/routes/auth.py
          test -f accessevent/routes/events.py
          test -f accessevent/routes/registrations.py
          test -f accessevent/utils/auth_helpers.py
      - name: Check security helpers
        run: |
          grep -q "hash_password" accessevent/utils/auth_helpers.py && echo "PASS: hash_password" || echo "FAIL: hash_password"
          grep -q "generate_token" accessevent/utils/auth_helpers.py && echo "PASS: jwt" || echo "FAIL: jwt"
          grep -q "role_required" accessevent/utils/auth_helpers.py && echo "PASS: roles" || echo "FAIL: roles"
      - name: Check accessibility
        run: 'grep -q "accessibility" accessevent/utils/accessibility.py && echo "PASS - accessibility" || echo "FAIL: accessibility"'
      - name: Syntax check
        run: python -m py_compile accessevent/app.py accessevent/config.py accessevent/models.py accessevent/routes/*.py accessevent/utils/*.py
      - run: echo "PASS - Day3 Backend Check completed"
